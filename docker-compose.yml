services:
  openvino-db:
    profiles:
      - local-db
    image: postgres
    container_name: openvino-database
    ports:
      - "${DB_PORT}:5432"
    expose:
      - 5432
    environment:
      - "POSTGRES_PASSWORD=${DB_PASSWORD}"
      - "POSTGRES_DB=${DB_NAME}"
    networks:
      - internal
    volumes:
      - openvino-db:/var/lib/postgresql/data
    restart: always

  openvino-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvino-api
    environment:
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "API_PORT=${API_PORT}"
      - "DB_USERNAME=${DB_USERNAME}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_HOST=${DB_HOST}"
      - "DB_PORT=${DB_PORT}"
      - "DB_NAME=${DB_NAME}"
      - "SECRET_AUTH=${SECRET_AUTH}"
      - "ETH_DEFAULT_ADMIN_PUBLIC=${ETH_DEFAULT_ADMIN_PUBLIC}"
      - "ETH_DEFAULT_ADMIN_PRIVATE=${ETH_DEFAULT_ADMIN_PRIVATE}"
      - "ETH_INFURA_SECRET=${ETH_INFURA_SECRET}"
      - "ETH_NETWORK=${ETH_NETWORK}"
      - "ETH_SMART_CONTRACT=${ETH_SMART_CONTRACT}"
      - "SKIP_AUTO_MIGRATE=${SKIP_AUTO_MIGRATE:-false}"
    networks:
      - internal
    ports:
      - "${API_PORT}:${API_PORT}"
    expose:
      - "${API_PORT}"
    restart: always
    command: ./wait-for-it.sh -t 0 ${DB_HOST}:${DB_PORT} -- ./main

networks:
  internal:

volumes:
  openvino-db:
